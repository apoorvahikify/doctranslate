<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Translator Engine AI</title>
    <link rel="stylesheet" th:href="@{/style.css}" href="/style.css">
</head>
<body>
    <div class="container">
        <h2>Document & Text Translator Engine</h2>

        <div class="input-section">
            <label for="targetLang">Select Target Language:</label>
            <select id="targetLang">
                <option value="kn" selected>Kannada</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="ml">Malayalam</option>
                <option value="ja">Japanese</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="upload-section">
            <h3>Upload File (PDF, DOCX, Image, TXT)</h3>
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Translate File</button>
        </div>

        <div class="text-section">
            <h3>Direct Text Translation</h3>
            <textarea id="directText" placeholder="Enter text here..."></textarea>
            <button onclick="translateText()">Translate Text</button>
        </div>

        <div class="output-section">
            <h3>Translation Result:</h3>
            <pre id="outputResult"></pre>
        </div>
    </div>

    <script th:src="@{/script.js}" src="/script.js"></script>
</body>
</html>
